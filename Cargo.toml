[workspace]
resolver = "3"
members = [
    "crates/prism-core",
    "crates/prism-ntfs",
    "crates/prism-types",
    "crates/prism-benches",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE-PROPRIETARY"
rust-version = "1.98.0"
repository = "https://example.invalid/prism"

[workspace.lints.rust]
# PRISM-ENG policy (docs/06-RUST-CORE.md § engineering bar): panics are defects.
# Integration tests may unwrap; src/ denies. See crates' Cargo.toml overrides.
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
integer_division = "warn"

[workspace.dependencies]
# --- engine core -------------------------------------------------------------
crossbeam-channel = { version = "0.5" }
crossbeam-deque = "0.8"
rayon = "1.12"
parking_lot = "0.12"
# --- DTOs / serialization ----------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
# --- crypto / licensing ------------------------------------------------------
ed25519-dalek = { version = "3", default-features = false }
blake3 = "1.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# --- persistence ---------------------------------------------------------------
rusqlite = { version = "0.40", features = ["bundled"] }
zstd = "0.14"
# --- diagnostics ---------------------------------------------------------------
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# --- platform -------------------------------------------------------------------
widestring = "1.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_System_WindowsProgramming",
    "Wdk_System_SystemInformation",
] }
# --- napi bridge ----------------------------------------------------------------
napi = { version = "3", default-features = false, features = ["napi4", "napi8", "serde-json", "compat-mode", "error_anyhow", "async", "dyn-symbols"] }
napi-derive = "3"
# --- dev / test -------------------------------------------------------------------
criterion = "0.8"
proptest = "1.11"
tempfile = "3.27"

[profile.release]
codegen-units = 1
lto = "fat"
# NOTE: `panic` stays at the default "unwind" — REQUIRED for the NAPI cdylib
# boundary (catch_unwind converts panics to EngineError::Internal before they
# cross FFI; docs/06-RUST-CORE.md § 10). Per-package panic overrides are not
# allowed by cargo; test binaries tolerate unwind.

[profile.bench]
debug = true
