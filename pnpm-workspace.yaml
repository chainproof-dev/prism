packages:
  - apps/desktop
  - apps/license-server
  - packages/shared
  - packages/ui

# pnpm 11 build-script approvals (supersedes onlyBuiltDependencies):
# native deps we trust to run install scripts.
allowBuilds:
  better-sqlite3: true
  cbor-extract: true
  esbuild: true
  electron: true
  '@napi-rs/cli': true

verifyDepsBeforeRun: false
